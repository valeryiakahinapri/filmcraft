name: Artifacts (unsigned)

# Builds the complete release artifacts from a tagged commit and publishes them as a GitHub
# release on this fork. Mirrors the official storytold release pipeline's macOS-universal and
# web jobs (craft-fonts, Kokoro neural voices, Brotli-precompressed wasm), minus what needs the
# org's signing infrastructure: the macOS app is ad-hoc signed only, so on first launch
# Gatekeeper needs an explicit right-click > Open (or `xattr -cr FilmCraft.app`).
#
# Trigger: push a tag `build-*`. The tag's commit is what gets built.

on:
  push:
    tags: ["build-*"]

permissions:
  contents: write

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-build:
    name: macOS ${{ matrix.target }}
    timeout-minutes: 180
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0deed1e0abfc6a9f121d4b3e47cc8c786accc1b # v2.8.0
        with:
          key: artifacts-macos-${{ matrix.target }}
      - name: Check out craft-fonts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Build (with Kokoro neural voices)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo build --release --locked -p filmcraft -p filmcraft-cli --features filmcraft/neural-voices --target ${{ matrix.target }}
      - name: Upload the target's binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/filmcraft
            target/${{ matrix.target }}/release/filmcraft-cli
          if-no-files-found: error

  macos-package:
    name: macOS universal package (unsigned)
    timeout-minutes: 30
    needs: macos-build
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Place both targets' binaries where package.sh lipo's them from
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-bin-*
          path: binaries
      - run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "target/$t/release"
            cp "binaries/macos-bin-$t/filmcraft" "binaries/macos-bin-$t/filmcraft-cli" "target/$t/release/"
          done
      - name: Check out craft-fonts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Package (ad-hoc signed; no Apple certificate exists on this fork)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal --skip-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  web:
    name: Web (wasm)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0deed1e0abfc6a9f121d4b3e47cc8c786accc1b # v2.8.0
        with:
          key: artifacts-web
      - name: binaryen (wasm-opt; without it the wasm is 49 MB instead of 39)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
      - name: Check out craft-fonts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Build and zip (package.sh installs the matching wasm-bindgen CLI in CI)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub release
    timeout-minutes: 15
    needs: [macos-package, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Expose the precompressed wasm as its own asset
        run: |
          set -euo pipefail
          cd dist/release
          mkdir -p unzipped && unzip -q filmcraft-web-*.zip -d unzipped
          cp unzipped/filmcraft-web-*/filmcraft_web_bg.wasm.br .
          rm -rf unzipped
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist/release
          shopt -s nullglob
          : > SHA-256SUMS.txt
          for f in *.dmg *.zip *.wasm.br; do
            sha256sum "$f" >> SHA-256SUMS.txt
          done
          cat SHA-256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]") ; next } in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          sha="$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            --title "FilmCraft $version (unsigned build $sha)" \
            --notes "Built from commit \`$(git rev-parse HEAD)\` by the fork's artifacts workflow.

          ## macOS (universal: Apple silicon + Intel)

          - **filmcraft-$version-macos-universal.dmg** — FilmCraft.app plus the headless CLI zip.
            Ad-hoc signed only: this fork has no Apple developer certificate, so on first launch
            right-click FilmCraft.app and choose **Open** (or run \`xattr -cr /Applications/FilmCraft.app\`).
            Includes the Kokoro neural voices and the craft fonts, exactly like the official packages.

          ## Web (wasm)

          - **filmcraft-web-$version.zip** — the self-contained static site.
          - **filmcraft_web_bg.wasm.br** — the Brotli q11 (16 MiB window) precompressed wasm
            extracted from the zip: the smallest HTTP transfer, for hosts that serve
            \`Content-Encoding: br\` from sibling \`.br\` files.

          All assets are checksummed in SHA-256SUMS.txt." \
            dist/release/*
