# Evaluates the Nix flake (no build, about a minute): `nix build` / `nix develop` stop at evaluation
# when Cargo.lock gains something nix/package.nix can't vendor, and nothing else would notice.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-sources:
    # SHA-pinned after the Nov 2026 shared-action breakage; move the pin forward deliberately, after checking the shared repo's own action pins.
    uses: storytold/craft-common-actions/.github/workflows/git-sources.yml@88148a57ef09ef407d73c0f385e04cc7f4c2720a

  nix:
    # SHA-pinned after the Nov 2026 shared-action breakage (a moving @main broke every suite); move the pin forward deliberately, after checking the shared repo's own action pins.
    uses: storytold/craft-common-actions/.github/workflows/nix.yml@88148a57ef09ef407d73c0f385e04cc7f4c2720a
