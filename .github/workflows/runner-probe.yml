name: Runner probe

# A minimal dispatch-only probe: which macOS runner labels can this repo actually provision?
# Not part of the release pipeline; safe to delete once the pool question is settled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        label: [macos-15, macos-14, macos-13, ubuntu-latest]
    steps:
      - run: |
          uname -a
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          echo "probe ok on ${{ matrix.label }}"
