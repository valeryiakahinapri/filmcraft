[package]
name = "filmcraft-cloud"
description = "Local PoC media workspace backend for FilmCraft on the web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "filmcraft-cloud"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
